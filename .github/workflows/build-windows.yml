name: Compilar Windows

on:
  push:
  workflow_dispatch:

jobs:
  msi:
    runs-on: windows-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      # Historial completo: la versión es 1.2.<cantidad de commits>.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Número de compilación
        id: build
        shell: bash
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Instalador MSI
        run: ./gradlew :shared:jvmTest :desktopApp:test :desktopApp:createDistributable :desktopApp:packageMsi

      # Ícono de ResuenApp en el asistente de instalación (banner y panel de bienvenida).
      - name: Imágenes del instalador
        shell: pwsh
        run: |
          $msi = Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          ./desktopApp/installer/brand-msi.ps1 -Msi $msi.FullName

      # ResuenApp-Setup.exe: el .msi dentro de un instalador WiX (Burn) que sí muestra el ícono de
      # la app en la barra de título. Usa el WiX que descarga el plugin de Compose.
      - name: Instalador con ícono (Setup.exe)
        shell: pwsh
        run: |
          $candle = Get-ChildItem -Path build, desktopApp/build -Recurse -Filter candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $candle) { throw "No se encontró WiX (candle.exe)" }
          $wix = $candle.DirectoryName
          $msi = (Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName
          $version = [regex]::Match((Split-Path $msi -Leaf), '\d+\.\d+\.\d+').Value
          $dir = (Resolve-Path desktopApp/installer).Path
          $out = "desktopApp/build/compose/binaries/main/setup"
          New-Item -ItemType Directory -Force $out | Out-Null
          & "$wix\candle.exe" -nologo -ext WixBalExtension "-dVersion=$version" "-dMsi=$msi" "-dInstallerDir=$dir" -out "$out\bundle.wixobj" "$dir\bundle.wxs"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$wix\light.exe" -nologo -ext WixBalExtension -out "$out\ResuenApp-$version-Setup.exe" "$out\bundle.wixobj"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem $out\*.exe

      # Abre el Setup.exe en esta máquina y fotografía su ventana: comprueba que el tema Noche carga
      # (si no, Burn se cierra solo) y deja las capturas en el artefacto "Instalador-capturas" para
      # revisar el diseño en los cuatro idiomas sin tener que instalar nada.
      - name: Capturas del instalador
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class Win {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll")] public static extern IntPtr FindWindow(string cls, string title);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          "@
          $setup = (Get-ChildItem desktopApp/build/compose/binaries/main/setup/*.exe | Select-Object -First 1).FullName
          $name = [IO.Path]::GetFileNameWithoutExtension($setup)
          $shots = "desktopApp/build/compose/binaries/main/capturas"
          New-Item -ItemType Directory -Force $shots | Out-Null
          $shots = (Resolve-Path $shots).Path

          function Wait-Window($seconds) {
            for ($i = 0; $i -lt $seconds * 4; $i++) {
              $h = [Win]::FindWindow("WixStdBA", $null)
              if ($h -ne [IntPtr]::Zero) { return $h }
              Start-Sleep -Milliseconds 250
            }
            return [IntPtr]::Zero
          }
          function Shot($h, $file) {
            [Win]::SetForegroundWindow($h) | Out-Null
            Start-Sleep -Milliseconds 700
            $r = New-Object Win+RECT
            [Win]::GetWindowRect($h, [ref]$r) | Out-Null
            $bmp = New-Object System.Drawing.Bitmap ($r.R - $r.L), ($r.B - $r.T)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size)
            $bmp.Save((Join-Path $shots $file))
            $g.Dispose(); $bmp.Dispose()
          }
          function Shot-Screen($file) {
            Add-Type -AssemblyName System.Windows.Forms
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $shots $file))
            $g.Dispose(); $bmp.Dispose()
          }
          function Close-Setup {
            Get-Process -Name $name -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
          }
          function Open-Setup($arguments, $file) {
            $log = Join-Path $shots "$file.log"
            $p = Start-Process $setup -ArgumentList "$arguments -log `"$log`"" -PassThru
            $h = Wait-Window 30
            if ($h -eq [IntPtr]::Zero) {
              Get-Process -Name $name -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Proceso $($_.Id): ventana '$($_.MainWindowTitle)'" }
              Shot-Screen "$file-pantalla.png"
              if (Test-Path $log) { Get-Content $log -Tail 60 | Write-Host }
              throw "El Setup.exe no abrió su ventana ($arguments)"
            }
            Start-Sleep 2
            Shot $h "$file.png"
            return $p
          }

          # Bienvenida en cada idioma (1034 = español, 1036 = francés, 1046 = portugués, 1033 = inglés).
          foreach ($lang in "1034", "1033", "1036", "1046") {
            Open-Setup "-lang $lang" "1-bienvenida-$lang" | Out-Null
            Close-Setup
          }
          # Progreso (instalación sin preguntas) y, ya instalado, la pantalla de reparar/desinstalar.
          $p = Start-Process $setup -ArgumentList "/passive -lang 1034 -log `"$(Join-Path $shots '2-progreso.log')`"" -PassThru
          $h = Wait-Window 30
          if ($h -ne [IntPtr]::Zero) { Start-Sleep -Milliseconds 1500; Shot $h "2-progreso-1034.png" }
          $p.WaitForExit(180000) | Out-Null
          Open-Setup "-lang 1034" "3-modificar-1034" | Out-Null
          Close-Setup
          Start-Process $setup -ArgumentList "/uninstall /quiet" -Wait
          Get-ChildItem $shots

      # Las capturas también van al registro en base64 (entre marcas), para poder verlas sin
      # descargar el artefacto.
      - name: Capturas en el registro
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem desktopApp/build/compose/binaries/main/capturas/*.png -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "=====PNG $($_.Name)"
            Write-Output ([Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName)))
            Write-Output "=====FIN"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Instalador-capturas
          path: desktopApp/build/compose/binaries/main/capturas/
          if-no-files-found: ignore

      # Abre el ejecutable ya empaquetado en modo de prueba: comprueba que FFmpeg y la lectura
      # de etiquetas funcionan dentro del instalador (sin salida de audio, el servidor no tiene).
      - name: Prueba del ejecutable
        shell: pwsh
        run: |
          $exe = (Resolve-Path "desktopApp/build/compose/binaries/main/app/ResuenApp/ResuenApp.exe").Path
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test", "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Output "Sin reporte" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ResuenApp-Windows
          path: |
            desktopApp/build/compose/binaries/main/setup/*.exe
            desktopApp/build/compose/binaries/main/msi/*.msi

      # Cada push a experimental se publica en el repo público de instaladores, de donde la app
      # se actualiza sola. Necesita el secreto RELEASES_TOKEN (permiso Contents: write en ese repo).
      - name: Publicar versión
        if: github.ref == 'refs/heads/experimental' && env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: EdoGris/ResuenApp-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: exp-1.2.${{ steps.build.outputs.number }}
          name: ResuenApp 1.2.${{ steps.build.outputs.number }} (experimental)
          prerelease: true
          body: ${{ github.event.head_commit.message }}
          files: desktopApp/build/compose/binaries/main/setup/*.exe
