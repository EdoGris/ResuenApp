name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # El runner ubuntu-latest ya trae el SDK de Android (ANDROID_HOME) con las licencias
      # aceptadas; android-actions/setup-android@v3 fallaba al intentar instalar el paquete
      # "tools", que Google retiró del repositorio del SDK.

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests y APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ResuenApp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
