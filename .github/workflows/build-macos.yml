name: Compilar macOS

on:
  push:
  workflow_dispatch:

jobs:
  dmg:
    # jpackage solo empaqueta para la máquina en la que corre: una .dmg por arquitectura.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar la app
        run: ./gradlew :shared:jvmTest :desktopApp:createDistributable

      # Igual que en Windows: abre la app ya empaquetada en modo de prueba para comprobar que
      # FFmpeg (librerías de esta arquitectura) y la lectura de etiquetas funcionan.
      - name: Prueba de la app
        run: |
          app="desktopApp/build/compose/binaries/main/app/ResuenApp.app"
          out="$RUNNER_TEMP/selftest.txt"
          set +e
          "$app/Contents/MacOS/ResuenApp" --self-test "$out"
          code=$?
          set -e
          if [ -f "$out" ]; then cat "$out"; else echo "Sin reporte"; fi
          file "$app/Contents/MacOS/ResuenApp"
          exit $code

      # La .dmg se arma con create-dmg (no con la de jpackage) para tener el ícono de ResuenApp
      # en el volumen, el fondo con la marca y una ventana sin barras ni scroll.
      - name: Imagen de disco (.dmg)
        run: |
          brew install create-dmg
          version=$(sed -n 's/.*packageVersion = "\(.*\)".*/\1/p' desktopApp/build.gradle.kts)
          mkdir -p dist
          desktopApp/installer/macos/make-dmg.sh \
            desktopApp/build/compose/binaries/main/app/ResuenApp.app \
            "dist/ResuenApp-$version-macOS-${{ matrix.arch }}.dmg"
          ls -la dist

      - name: Revisar la .dmg
        run: |
          dmg=$(ls dist/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mnt"
          ls -la "$mnt" "$mnt/.background"
          test -f "$mnt/.VolumeIcon.icns"
          test -f "$mnt/.DS_Store"
          test -d "$mnt/ResuenApp.app"
          test -L "$mnt/Applications"
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v4
        with:
          name: ResuenApp-macOS-${{ matrix.arch }}
          path: dist/*.dmg
