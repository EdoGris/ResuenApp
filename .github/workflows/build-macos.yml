name: Compilar macOS

on:
  push:
  workflow_dispatch:

jobs:
  dmg:
    # jpackage solo empaqueta para la máquina en la que corre: una .dmg por arquitectura.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Imagen de disco (.dmg)
        run: ./gradlew :shared:jvmTest :desktopApp:packageDmg

      # Igual que en Windows: abre la app ya empaquetada en modo de prueba para comprobar que
      # FFmpeg (librerías de esta arquitectura) y la lectura de etiquetas funcionan.
      - name: Prueba de la app
        run: |
          app="desktopApp/build/compose/binaries/main/app/ResuenApp.app"
          out="$RUNNER_TEMP/selftest.txt"
          set +e
          "$app/Contents/MacOS/ResuenApp" --self-test "$out"
          code=$?
          set -e
          if [ -f "$out" ]; then cat "$out"; else echo "Sin reporte"; fi
          file "$app/Contents/MacOS/ResuenApp"
          exit $code

      - name: Nombre con la arquitectura
        run: |
          cd desktopApp/build/compose/binaries/main/dmg
          for f in *.dmg; do mv "$f" "${f%.dmg}-macOS-${{ matrix.arch }}.dmg"; done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ResuenApp-macOS-${{ matrix.arch }}
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
