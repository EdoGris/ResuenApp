[project]
name = "resuenapp-aligner"
version = "0.1.0"
description = "Alineación forzada de letras (WhisperX) para ResuenApp"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Modelos: varios GB. No hacen falta para correr los tests.
ml = [
    "whisperx>=3.4,<4",
    "demucs>=4.0.1",
]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
